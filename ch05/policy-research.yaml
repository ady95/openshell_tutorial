# 리서치 에이전트: 정해진 문서 사이트만 읽기, 쓰기는 작업 폴더에만
version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /etc]
  read_write: [/tmp, /dev/null]
landlock:
  compatibility: hard_requirement
network_policies:
  docs_read:
    endpoints:
      - host: en.wikipedia.org
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/api/rest_v1/page/summary/*" }
      - host: export.arxiv.org
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/api/query" }
    binaries:
      - path: /usr/bin/python3.12
