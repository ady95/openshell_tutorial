# 조직의 최대 허용 범위(경계). 에이전트용 정책은 이보다 넓으면 안 된다.
version: 1
filesystem_policy:
  read_only: [/usr, /lib, /etc]
  read_write: [/tmp, /dev/null]
landlock:
  compatibility: hard_requirement
network_policies:
  github_api_read:
    endpoints:
      - host: api.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - path: /usr/bin/curl
  pypi_read:
    endpoints:
      - host: pypi.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - path: /usr/bin/python3.12
