# 경계에 없는 호스트 추가
version: 1
filesystem_policy:
  read_only: [/usr, /lib, /etc]
  read_write: [/tmp, /dev/null]
landlock:
  compatibility: hard_requirement
network_policies:
  other:
    endpoints:
      - host: example.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - path: /usr/bin/curl
