# 같은 호스트를 다른 프로그램(python3.12)에 허용
version: 1
filesystem_policy:
  read_only: [/usr, /lib, /etc]
  read_write: [/tmp, /dev/null]
landlock:
  compatibility: hard_requirement
network_policies:
  github_api_read:
    endpoints:
      - host: api.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - path: /usr/bin/python3.12
