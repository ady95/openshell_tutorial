# 경계의 일부만: GitHub 읽기만
version: 1
filesystem_policy:
  read_only: [/usr, /lib, /etc]
  read_write: [/tmp, /dev/null]
landlock:
  compatibility: hard_requirement
network_policies:
  github_api_read:
    endpoints:
      - host: api.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - path: /usr/bin/curl
