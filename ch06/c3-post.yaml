# GitHub에 쓰기 메서드 추가
version: 1
filesystem_policy:
  read_only: [/usr, /lib, /etc]
  read_write: [/tmp, /dev/null]
landlock:
  compatibility: hard_requirement
network_policies:
  github_api_rw:
    endpoints:
      - host: api.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-write
    binaries:
      - path: /usr/bin/curl
