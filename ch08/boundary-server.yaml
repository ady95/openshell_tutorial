# 서버관리 에이전트의 최대 권한(경계)
# 조회 전부 + web 서비스 재시작 하나까지만. 중지·삭제·다른 서비스 재시작은 경계 밖.
version: 1
filesystem_policy:
  include_workdir: false
  read_only: [/usr, /lib, /etc, /var/log, /proc, /dev/urandom]
  read_write: [/sandbox, /tmp, /dev/null]
landlock:
  compatibility: hard_requirement
network_policies:
  ollama:
    endpoints:
      - host: host.openshell.internal
        port: 11434
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: /v1/models }
          - allow: { method: POST, path: /v1/chat/completions }
    binaries:
      - path: /usr/bin/curl
      - path: /usr/bin/python3.12
      - path: /usr/local/bin/opencode
  ops:
    endpoints:
      - host: host.openshell.internal
        port: 18080
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/v1/status/*" }
          - allow: { method: GET, path: /v1/containers }
          - allow: { method: GET, path: "/v1/services/*/status" }
          - allow: { method: GET, path: "/v1/services/*/logs" }
          - allow: { method: POST, path: /v1/services/web/restart }
    binaries:
      - path: /usr/bin/python3.12
      - path: /usr/bin/curl
